name: student-1-ci

on:

  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build Student 1 services
        run: docker compose build student-1-frontend student-1-backend student-1-db

  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Student 1 services
        run: docker compose up -d student-1-frontend student-1-backend student-1-db

      - name: Smoke check Student 1 services
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                --connect-timeout 5 \
                --max-time 20 \
                "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PASS: $url -> HTTP $code"
                return 0
              fi

              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL: $url after $attempts attempts"
            return 1
          }

          echo "=== Student 1 Frontend ==="
          check_url "http://localhost:16004/"

          echo "=== Student 1 Backend ==="
          check_url "http://localhost:16005/"

          echo "=== Student 1 Database ==="
          check_url "http://localhost:16006/health"

      - name: Stop Student 1 services
        if: always()
        run: docker compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate report.json
        run: |
          cat > reports/report.json << EOF
          {
            "workflow_name": "student-1-ci",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "repository": "${{ github.repository }}"
          }
          EOF

      - name: Generate report.md
        run: |
          cat > reports/report.md << EOF
          # Student 1 CI Workflow Report

          - Workflow: student-1-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Repository: ${{ github.repository }}

          ## CI Stages

          1. Docker image build
          2. Student 1 service smoke check
          3. Automated tests
          4. Evidence generation

          ## Current Testing Status

          Student 1 automated tests currently contain placeholder
          tests. Feature-specific unit and integration tests will
          be added as the Student 1 feature is implemented.

          ## Health Check Status

          The current CI uses temporary HTTP retry-based smoke checks.
          As a future improvement, Docker healthchecks can replace these checks once the
          service healthcheck configuration has been added.
          EOF

      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          # GitHub Actions Run

          Run URL:

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-1-ci-evidence
          path: reports