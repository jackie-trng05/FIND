# CI workflow for Student 2 (Job Posting Management)
#
# Builds the three microservice Docker images and runs the pytest suite that
# validates the database service and backend HTML formatters.
name: student-2-ci

on:
  push:
    branches: [ main ]
    paths:
      - "student-2/**"
      - ".github/workflows/student-2-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "student-2/**"
      - ".github/workflows/student-2-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: student-2
        run: pip install -r tests/requirements.txt

      - name: Run tests
        working-directory: student-2
        run: python -m pytest tests -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build database image
        run: docker build -t student-2-db ./student-2/database

      - name: Build backend image
        run: docker build -t student-2-backend ./student-2/backend

      - name: Build frontend image
        run: docker build -t student-2-frontend ./student-2/frontend
