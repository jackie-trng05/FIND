name: student-3-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build Student 3 services
        run: docker compose build student-3-frontend student-3-backend student-3-db

  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Student 3 services
        run: docker compose up -d student-3-frontend student-3-backend student-3-db

      - name: Smoke check Student 3 services
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                --connect-timeout 5 \
                --max-time 20 \
                "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PASS: $url -> HTTP $code"
                return 0
              fi

              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL: $url after $attempts attempts"
            return 1
          }

          echo "=== Student 3 Frontend ==="
          check_url "http://localhost:16010/health"

          echo "=== Student 3 Backend ==="
          check_url "http://localhost:16011/health"

          echo "=== Student 3 Database ==="
          check_url "http://localhost:16012/health"

      - name: Stop Student 3 services
        if: always()
        run: docker compose down -v

  test:
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: student-3
        run: pip install -r tests/requirements.txt

      - name: Run tests
        working-directory: student-3
        run: python -m pytest tests -q

  evidence-pack:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate report.json
        run: |
          cat > reports/report.json << EOF
          {
            "workflow_name": "student-3-ci",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "repository": "${{ github.repository }}"
          }
          EOF

      - name: Generate report.md
        run: |
          cat > reports/report.md << EOF
          # Student 3 CI Workflow Report

          - Workflow: student-3-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Repository: ${{ github.repository }}

          ## CI Stages

          1. Docker image build
          2. Student 3 service smoke check
          3. Automated tests
          4. Evidence generation

          ## Current Testing Status

          Student 3 automated tests run as part of this workflow via pytest.

          ## Health Check Status

          The current CI uses temporary HTTP retry-based smoke checks.
          As a future improvement, Docker healthchecks can replace these checks once the
          service healthcheck configuration has been added.
          EOF

      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          # GitHub Actions Run

          Run URL:

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-3-ci-evidence
          path: reports
