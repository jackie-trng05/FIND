# CI workflow for Student 3 (Application Management)
#
# Builds the three microservice Docker images and runs the pytest suite that
# validates the database service and backend HTML formatters.
name: student-3-ci

on:
  push:
    branches: [ main ]
    paths:
      - "student-3/**"
      - ".github/workflows/student-3-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "student-3/**"
      - ".github/workflows/student-3-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: student-3
        run: pip install -r tests/requirements.txt

      - name: Run tests
        working-directory: student-3
        run: python -m pytest tests -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build database image
        run: docker build -t student-3-db ./student-3/database

      - name: Build backend image
        run: docker build -t student-3-backend ./student-3/backend

      - name: Build frontend image
        run: docker build -t student-3-frontend ./student-3/frontend
