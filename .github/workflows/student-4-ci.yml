# CI workflow for Student 4 (Interview Management)
#
# Builds the frontend, backend and database Docker images, smoke-checks the
# running services, and uploads a small evidence pack.
name: student-4-ci

on:
  push:
    branches: [ main ]
    paths:
      - "student-4/**"
      - ".github/workflows/student-4-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "student-4/**"
      - ".github/workflows/student-4-ci.yml"
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Build Student 4 services
        run: docker compose build student-4-frontend student-4-backend student-4-db

  smoke-check:
    runs-on: ubuntu-latest
    needs: [build-images]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker
        run: docker --version

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Student 4 services
        run: docker compose up -d student-4-frontend student-4-backend student-4-db

      - name: Smoke check Student 4 services
        run: |
          check_url() {
            local url="$1"
            local attempts=8
            local code=""

            for i in $(seq 1 "$attempts"); do
              code=$(curl -sS \
                -o /dev/null \
                -w "%{http_code}" \
                --connect-timeout 5 \
                --max-time 20 \
                "$url" || true)

              if [ "$code" = "200" ]; then
                echo "PASS: $url -> HTTP $code"
                return 0
              fi

              echo "Retry $i/$attempts for $url (got: ${code:-none})"
              sleep 2
            done

            echo "FAIL: $url after $attempts attempts"
            return 1
          }

          echo "=== Student 4 Frontend ==="
          check_url "http://localhost:16013/"

          echo "=== Student 4 Backend ==="
          check_url "http://localhost:16014/"

          echo "=== Student 4 Database ==="
          check_url "http://localhost:16015/"

      - name: Stop Student 4 services
        if: always()
        run: docker compose down -v

  evidence-pack:
    runs-on: ubuntu-latest
    needs: [smoke-check]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate report.json
        run: |
          cat > reports/report.json << EOF
          {
            "workflow_name": "student-4-ci",
            "run_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "repository": "${{ github.repository }}"
          }
          EOF

      - name: Generate report.md
        run: |
          cat > reports/report.md << EOF
          # Student 4 CI Workflow Report

          - Workflow: student-4-ci
          - Run ID: ${{ github.run_id }}
          - Commit SHA: ${{ github.sha }}
          - Branch: ${{ github.ref_name }}
          - Repository: ${{ github.repository }}

          ## CI Stages

          1. Docker image build
          2. Student 4 service smoke check
          3. Evidence generation

          ## Current Testing Status

          The Student 4 Interview Management service is validated by
          HTTP smoke checks against the frontend, backend and database
          containers. Feature-specific unit and integration tests will
          be added under student-4/tests as the interview feature matures.

          ## Health Check Status

          The current CI uses temporary HTTP retry-based smoke checks.
          As a future improvement, Docker healthchecks can replace these checks once the
          service healthcheck configuration has been added.
          EOF

      - name: Generate run-view.md
        run: |
          cat > reports/run-view.md << EOF
          # GitHub Actions Run

          Run URL:

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-4-ci-evidence
          path: reports
