repos:
  - repo: local
    hooks:
      - id: ruff-scan
        name: Ruff security scan and Release 2 evidence
        entry: python shared/release2_reports.py security --scanner ruff --hook
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: detect-secrets-scan
        name: Secret scan and Release 2 evidence
        entry: python shared/release2_reports.py security --scanner detect-secrets --hook
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: pip-audit-scan
        name: Dependency audit and Release 2 evidence
        entry: python shared/release2_reports.py security --scanner pip-audit --hook
        language: system
        pass_filenames: false
        stages: [pre-commit]