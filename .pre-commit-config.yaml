repos:
  - repo: local
    hooks:
      - id: ruff-scan-student-1
        name: Ruff Scan (student-1)
        entry: python scripts/pre_commit_pytest.py tests/pre_commit/test_ruff_scan_student1.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "ruff==0.17.1"]
        files: ^student-1/
        pass_filenames: false
        stages: [pre-commit]
      - id: detect-secrets-scan-student-1
        name: detect-secrets Scan (student-1)
        entry: python scripts/pre_commit_pytest.py tests/pre_commit/test_secrets_scan_student1.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "detect-secrets==1.5.0"]
        files: ^student-1/
        pass_filenames: false
        stages: [pre-commit]
      - id: pip-audit-scan-student-1
        name: pip-audit Scan (student-1)
        entry: python scripts/pre_commit_pytest.py tests/pre_commit/test_dependency_audit_student1.py -v
        language: python
        additional_dependencies: ["pytest==9.1.1", "pip-audit==2.10.1"]
