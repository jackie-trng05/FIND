services:
  shared-frontend:
    build:
      context: .
      dockerfile: shared/frontend/Dockerfile
    container_name: find-shared-frontend
    ports:
      - "16001:3000"
    environment:
      PORT: 3000
      STUDENT_1_FRONTEND_URL: http://localhost:16004
      STUDENT_2_FRONTEND_URL: http://localhost:16007
      STUDENT_3_FRONTEND_URL: http://localhost:16010
      STUDENT_4_FRONTEND_URL: http://localhost:16013
      STUDENT_5_FRONTEND_URL: http://localhost:16016
      SHARED_API_PUBLIC_URL: http://localhost:16002
    volumes:
      - ./shared/css:/app/shared-css:ro
    depends_on:
      - shared-api
    networks:
      - find-network
    restart: unless-stopped

  shared-api:
    build:
      context: ./shared/backend
    container_name: find-shared-api
    ports:
      - "16002:5000"
    environment:
      PORT: 5000
      COOKIE_DOMAIN: localhost
      ALLOWED_ORIGINS: "http://localhost:16001,http://localhost:16004,http://localhost:16007,http://localhost:16010,http://localhost:16013,http://localhost:16016"
    depends_on:
      - shared-db
    networks:
      - find-network
    restart: unless-stopped

  shared-db:
    build:
      context: ./shared/database
    container_name: find-shared-db
    ports:
      - "16003:6000"
    environment:
      PORT: 6000
    networks:
      - find-network
    restart: unless-stopped

  student-1-frontend:
    build:
      context: .
      dockerfile: student-1/frontend/Dockerfile
    container_name: find-student-1-frontend
    ports:
      - "16004:3000"
    environment:
      PORT: 3000
      BACKEND_PUBLIC_URL: http://localhost:16005
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      FIND_HOME_URL: http://localhost:16001/dashboard
    volumes:
      - ./shared/css:/app/shared-css:ro
      - ./shared/frontend/static/js:/app/shared-js:ro
    depends_on:
      - student-1-backend
    networks:
      - find-network
    restart: unless-stopped

  student-1-backend:
    build:
      context: ./student-1/backend
    container_name: find-student-1-backend
    ports:
      - "16005:5001"
    environment:
      PORT: 5001
      SHARED_API_URL: http://find-shared-api:5000
      DATABASE_SERVICE_URL: http://find-student-1-db:6001
      BACKEND_PUBLIC_URL: http://localhost:16005
      FRONTEND_PUBLIC_URL: http://localhost:16004
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://find-rag-server:16070
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://find-multi-agent-server:16080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-1-db
    networks:
      - find-network
    restart: unless-stopped

  student-1-db:
    build:
      context: ./student-1/database
    container_name: find-student-1-db
    ports:
      - "16006:6001"
    environment:
      PORT: 6001
    networks:
      - find-network
    restart: unless-stopped

  student-2-frontend:
    build:
      context: .
      dockerfile: student-2/frontend/Dockerfile
    container_name: find-student-2-frontend
    ports:
      - "16007:3002"
    environment:
      PORT: 3002
      BACKEND_PUBLIC_URL: http://localhost:16008
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      FIND_HOME_URL: http://localhost:16001/dashboard
    volumes:
      - ./shared/css:/app/shared-css:ro
      - ./shared/frontend/static/js:/app/shared-js:ro
    depends_on:
      - student-2-backend
    networks:
      - find-network
    restart: unless-stopped

  student-2-backend:
    build:
      context: ./student-2/backend
    container_name: find-student-2-backend
    ports:
      - "16008:5002"
    environment:
      PORT: 5002
      DATABASE_SERVICE_URL: http://student-2-db:6002
      BACKEND_PUBLIC_URL: http://localhost:16008
      FRONTEND_PUBLIC_URL: http://localhost:16007
      SHARED_API_URL: http://find-shared-api:5000
      APPLICATIONS_DB_URL: http://student-3-db:6003
      APPLICATIONS_PUBLIC_URL: http://localhost:16010
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://find-rag-server:16070
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://find-multi-agent-server:16080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-2-db
      - shared-api
    networks:
      - find-network
    restart: unless-stopped

  student-2-db:
    build:
      context: ./student-2/database
    container_name: find-student-2-db
    ports:
      - "16009:6002"
    environment:
      PORT: 6002
    networks:
      - find-network
    restart: unless-stopped

  student-3-frontend:
    build:
      context: .
      dockerfile: student-3/frontend/Dockerfile
    container_name: find-student-3-frontend
    ports:
      - "16010:3003"
    environment:
      PORT: 3003
      BACKEND_SERVICE_URL: http://find-student-3-backend:5003
      BACKEND_PUBLIC_URL: http://localhost:16011
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      FIND_HOME_URL: http://localhost:16001/dashboard
      JOB_POSTINGS_URL: http://localhost:16007
    volumes:
      - ./shared/css:/app/shared-css:ro
      - ./shared/frontend/static/js:/app/shared-js:ro
    depends_on:
      - student-3-backend
    networks:
      - find-network
    restart: unless-stopped

  student-3-backend:
    build:
      context: ./student-3/backend
    container_name: find-student-3-backend
    ports:
      - "16011:5003"
    environment:
      PORT: 5003
      DATABASE_SERVICE_URL: http://student-3-db:6003
      POSTINGS_DB_URL: http://student-2-db:6002
      SHARED_API_URL: http://find-shared-api:5000
      SHARED_DB_URL: http://find-shared-db:6000
      STUDENT_1_DB_URL: http://find-student-1-db:6001
      INTERVIEWS_DB_URL: http://student-4-db:6004
      BACKEND_PUBLIC_URL: http://localhost:16011
      FRONTEND_PUBLIC_URL: http://localhost:16010
      INTERVIEWS_PUBLIC_URL: http://localhost:16013
      EVALUATIONS_PUBLIC_URL: http://localhost:16016
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://find-rag-server:16070
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://find-multi-agent-server:16080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-3-db
      - shared-api
      - student-2-db
    networks:
      - find-network
    restart: unless-stopped

  student-3-db:
    build:
      context: ./student-3/database
    container_name: find-student-3-db
    ports:
      - "16012:6003"
    environment:
      PORT: 6003
    networks:
      - find-network
    restart: unless-stopped

  student-4-frontend:
    build:
      context: .
      dockerfile: student-4/frontend/Dockerfile
    container_name: find-student-4-frontend
    ports:
      - "16013:3004"
    environment:
      PORT: 3004
      BACKEND_PUBLIC_URL: http://localhost:16014
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      FIND_HOME_URL: http://localhost:16001/dashboard
      APPLICATIONS_PUBLIC_URL: http://localhost:16010
    volumes:
      - ./shared/css:/app/shared-css:ro
      - ./shared/frontend/static/js:/app/shared-js:ro
    depends_on:
      - student-4-backend
    networks:
      - find-network
    restart: unless-stopped

  student-4-backend:
    build:
      context: ./student-4/backend
    container_name: find-student-4-backend
    ports:
      - "16014:5004"
    environment:
      PORT: 5004
      DATABASE_SERVICE_URL: http://student-4-db:6004
      APPLICATIONS_DB_URL: http://student-3-db:6003
      POSTINGS_DB_URL: http://student-2-db:6002
      SHARED_DB_URL: http://find-shared-db:6000
      SHARED_API_URL: http://find-shared-api:5000
      FRONTEND_PUBLIC_URL: http://localhost:16013
      BACKEND_PUBLIC_URL: http://localhost:16014
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://find-rag-server:16070
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://find-multi-agent-server:16080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-4-db
      - shared-api
    networks:
      - find-network
    restart: unless-stopped

  student-4-db:
    build:
      context: ./student-4/database
    container_name: find-student-4-db
    ports:
      - "16015:6004"
    environment:
      PORT: 6004
    networks:
      - find-network
    restart: unless-stopped

  student-5-frontend:
    build:
      context: .
      dockerfile: student-5/frontend/Dockerfile
    container_name: find-student-5-frontend
    ports:
      - "16016:3005"
    environment:
      PORT: 3005
      BACKEND_PUBLIC_URL: http://localhost:16017
      FIND_HOME_URL: http://localhost:16001/dashboard
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      APPLICATIONS_PUBLIC_URL: http://localhost:16010
    volumes:
      - ./shared/css:/app/shared-css:ro
      - ./shared/frontend/static/js:/app/shared-js:ro
    depends_on:
      - student-5-backend
    networks:
      - find-network
    restart: unless-stopped

  student-5-backend:
    build:
      context: ./student-5/backend
    container_name: find-student-5-backend
    ports:
      - "16017:5005"
    environment:
      PORT: 5005
      DATABASE_SERVICE_URL: http://find-student-5-db:6005
      SHARED_API_URL: http://find-shared-api:5000
      SHARED_DB_URL: http://find-shared-db:6000
      APPLICATIONS_DB_URL: http://student-3-db:6003
      POSTINGS_DB_URL: http://student-2-db:6002
      INTERVIEWS_DB_URL: http://student-4-db:6004
      FRONTEND_PUBLIC_URL: http://localhost:16016
      BACKEND_PUBLIC_URL: http://localhost:16017
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      MCP_ENABLED: "true"
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      RAG_ENABLED: "true"
      RAG_SERVER_URL: http://find-rag-server:16070
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://find-multi-agent-server:16080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-5-db
      - shared-api
      - student-3-db
      - student-2-db
      - student-4-db
    networks:
      - find-network
    restart: unless-stopped

  student-5-db:
    build:
      context: ./student-5/database
    container_name: find-student-5-db
    ports:
      - "16018:6005"
    environment:
      PORT: 6005
    networks:
      - find-network
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    container_name: find-mcp-server
    ports:
      - "16050:16050"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 16050
      SHARED_DB_URL: http://find-shared-db:6000
      STUDENT_1_DB_URL: http://find-student-1-db:6001
      STUDENT_2_DB_URL: http://find-student-2-db:6002
      STUDENT_3_DB_URL: http://find-student-3-db:6003
      STUDENT_4_DB_URL: http://find-student-4-db:6004
      STUDENT_5_DB_URL: http://find-student-5-db:6005
    depends_on:
      - shared-db
      - student-1-db
      - student-2-db
      - student-3-db
      - student-4-db
      - student-5-db
    networks:
      - find-network
    restart: unless-stopped

  rag-server:
    build:
      context: .
      dockerfile: rag-server/Dockerfile
    container_name: find-rag-server
    ports:
      - "16070:16070"
    environment:
      PORT: 16070
      MCP_SERVER_URL: http://find-mcp-server:16050/mcp
      # AI-Mode LLM: local Ollama by default; override OLLAMA_BASE_URL/OLLAMA_MODEL
      # and set LLM_API_KEY to use OpenRouter (see scripts/deploy-azure.sh).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
      AI_MODE_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp-server
    networks:
      - find-network
    restart: unless-stopped

  multi-agent-server:
    build:
      context: ./multi-agent-server
    container_name: find-multi-agent-server
    ports:
      - "16080:16080"
    environment:
      PORT: 16080
      SHARED_DB_URL: http://find-shared-db:6000
      STUDENT_1_DB_URL: http://find-student-1-db:6001
      STUDENT_2_DB_URL: http://find-student-2-db:6002
      STUDENT_3_DB_URL: http://find-student-3-db:6003
      STUDENT_4_DB_URL: http://find-student-4-db:6004
      STUDENT_5_DB_URL: http://find-student-5-db:6005
      # Multi-agent LLM: local Ollama by default; override OLLAMA_BASE_URL/models
      # and set LLM_API_KEY to use OpenRouter (see scripts/deploy-azure.sh).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REVIEW_MODEL: llama3.1:8b
    # Persist the append-only evidence logs to the host so local runs stay
    # visible in the repo (the container writes to /app, which is ephemeral).
    volumes:
      - ./multi-agent-server/workflow_history.jsonl:/app/workflow_history.jsonl
      - ./multi-agent-server/coordination_audit.jsonl:/app/coordination_audit.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-1-db
      - student-3-db
      - student-4-db
    networks:
      - find-network
    restart: unless-stopped

networks:
  find-network:
    driver: bridge
