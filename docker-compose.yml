services:
  shared-frontend:
    build:
      context: ./shared/frontend
    container_name: find-shared-frontend
    ports:
      - "16001:3000"
    environment:
      STUDENT_1_FRONTEND_URL: http://localhost:16004
    volumes:
      - ./shared/css:/app/shared-css:ro
    depends_on:
      - shared-api
    networks:
      - find-network
    restart: unless-stopped

  shared-api:
    build:
      context: ./shared/backend
    container_name: find-shared-api
    ports:
      - "16002:5000"
    environment:
      COOKIE_DOMAIN: localhost
      ALLOWED_ORIGINS: "http://localhost:16001,http://localhost:16004,http://localhost:16007,http://localhost:16010,http://localhost:16013,http://localhost:16016"
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ai-services/ai-mode:/app/ai_mode:ro
    depends_on:
      - shared-db
    networks:
      - find-network
    restart: unless-stopped

  shared-db:
    build:
      context: ./shared/database
    container_name: find-shared-db
    ports:
      - "16003:6000"
    networks:
      - find-network
    restart: unless-stopped

  student-1-frontend:
    build:
      context: ./student-1/frontend
    container_name: find-student-1-frontend
    ports:
      - "16004:3000"
    environment:
      STUDENT1_BACKEND_URL: http://find-student-1-backend:5001
      COOKIE_DOMAIN: localhost
    volumes:
      - ./shared/css:/app/shared-css:ro
    depends_on:
      - student-1-backend
    networks:
      - find-network
    restart: unless-stopped

  student-1-backend:
    build:
      context: ./student-1/backend
    container_name: find-student-1-backend
    ports:
      - "16005:5001"
    environment:
      SHARED_API_URL: http://find-shared-api:5000
      DB_SERVICE_URL: http://find-student-1-db:6001
    depends_on:
      - student-1-db
    networks:
      - find-network
    restart: unless-stopped

  student-1-db:
    build:
      context: ./student-1/database
    container_name: find-student-1-db
    ports:
      - "16006:6001"
    networks:
      - find-network
    restart: unless-stopped

  student-2-frontend:
    build:
      context: ./student-2/frontend
    container_name: find-student-2-frontend
    ports:
      - "16007:3002"
    environment:
      PORT: 3002
      BACKEND_PUBLIC_URL: http://localhost:16008
    depends_on:
      - student-2-backend
    networks:
      - find-network
    restart: unless-stopped

  student-2-backend:
    build:
      context: ./student-2/backend
    container_name: find-student-2-backend
    ports:
      - "16008:5002"
    environment:
      PORT: 5002
      DATABASE_SERVICE_URL: http://student-2-db:6002
      BACKEND_PUBLIC_URL: http://localhost:16008
      FRONTEND_PUBLIC_URL: http://localhost:16007
      SHARED_API_URL: http://find-shared-api:5000
      APPLICATIONS_DB_URL: http://student-3-db:6003
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-2-db
      - shared-api
    networks:
      - find-network
    restart: unless-stopped

  student-2-db:
    build:
      context: ./student-2/database
    container_name: find-student-2-db
    ports:
      - "16009:6002"
    environment:
      PORT: 6002
    networks:
      - find-network
    restart: unless-stopped

  student-3-frontend:
    build:
      context: ./student-3/frontend
    container_name: find-student-3-frontend
    ports:
      - "16010:3003"
    environment:
      PORT: 3003
      BACKEND_SERVICE_URL: http://find-student-3-backend:5003
      BACKEND_PUBLIC_URL: http://localhost:16011
      SHARED_API_PUBLIC_URL: http://localhost:16002
      LOGIN_URL: http://localhost:16001/login
      LOGOUT_URL: http://localhost:16002/api/auth/logout
      FIND_HOME_URL: http://localhost:16001/dashboard
      JOB_POSTINGS_URL: http://localhost:16007
    depends_on:
      - student-3-backend
    networks:
      - find-network
    restart: unless-stopped

  student-3-backend:
    build:
      context: ./student-3/backend
    container_name: find-student-3-backend
    ports:
      - "16011:5003"
    environment:
      PORT: 5003
      DATABASE_SERVICE_URL: http://student-3-db:6003
      POSTINGS_DB_URL: http://student-2-db:6002
      SHARED_API_URL: http://find-shared-api:5000
      SHARED_DB_URL: http://find-shared-db:6000
      STUDENT_1_BACKEND_URL: http://find-student-1-backend:5001
      BACKEND_PUBLIC_URL: http://localhost:16011
      FRONTEND_PUBLIC_URL: http://localhost:16010
      INTERVIEWS_PUBLIC_URL: http://localhost:16013
      EVALUATIONS_PUBLIC_URL: http://localhost:16016
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-3-db
      - shared-api
      - student-2-db
      - student-1-backend
    networks:
      - find-network
    restart: unless-stopped

  student-3-db:
    build:
      context: ./student-3/database
    container_name: find-student-3-db
    ports:
      - "16012:6003"
    environment:
      PORT: 6003
    networks:
      - find-network
    restart: unless-stopped

  student-4-frontend:
    build:
      context: ./student-4/frontend
    container_name: find-student-4-frontend
    ports:
      - "16013:80"
    depends_on:
      - student-4-backend
    networks:
      - find-network
    restart: unless-stopped

  student-4-backend:
    build:
      context: ./student-4/backend
    container_name: find-student-4-backend
    ports:
      - "16014:5001"
    environment:
      DATABASE_SERVICE_URL: http://student-4-db:5002
      APPLICATION_DB_URL: http://student-3-db:6003
      JOB_POSTING_DB_URL: http://student-2-db:6002
      SHARED_DB_URL: http://find-shared-db:6000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-4-db
    networks:
      - find-network
    restart: unless-stopped

  student-4-db:
    build:
      context: ./student-4/database
    container_name: find-student-4-db
    ports:
      - "16015:5002"
    networks:
      find-network:
        aliases:
          - student-4-db
    restart: unless-stopped

  student-5-frontend:
    build:
      context: ./student-5/frontend
    container_name: find-student-5-frontend
    ports:
      - "16016:3005"
    environment:
      BACKEND_PUBLIC_URL: http://localhost:16017
      FIND_HOME_URL: http://localhost:16001/dashboard
    volumes:
      - ./shared/css:/app/shared-css:ro
    depends_on:
      - student-5-backend
    networks:
      - find-network
    restart: unless-stopped

  student-5-backend:
    build:
      context: ./student-5/backend
    container_name: find-student-5-backend
    ports:
      - "16017:5005"
    environment:
      DATABASE_SERVICE_URL: http://find-student-5-db:6005
      SHARED_API_URL: http://find-shared-api:5000
      SHARED_DB_URL: http://find-shared-db:6000
      APPLICATIONS_DB_URL: http://student-3-db:6003
      POSTINGS_DB_URL: http://student-2-db:6002
      INTERVIEWS_DB_URL: http://student-4-db:5002
      FRONTEND_PUBLIC_URL: http://localhost:16016
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: llama3.1:8b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - student-5-db
      - shared-api
      - student-3-db
      - student-2-db
      - student-4-db
    networks:
      - find-network
    restart: unless-stopped

  student-5-db:
    build:
      context: ./student-5/database
    container_name: find-student-5-db
    ports:
      - "16018:6005"
    environment:
      PORT: 6005
    networks:
      - find-network
    restart: unless-stopped

networks:
  find-network:
    driver: bridge
