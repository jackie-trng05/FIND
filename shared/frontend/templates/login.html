<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log In — FIND</title>
  <link rel="stylesheet" href="/css/theme.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">
        <h1>FIND</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="login-alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="login-btn">
          Log In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register">Sign up</a>
      </div>

      <div class="auth-divider"><span>Demo Accounts</span></div>
      <div style="font-size:0.8rem;color:var(--text-muted);">
        <p><strong>Staff:</strong> staff@find.com / staff123</p>
        <p><strong>Applicant:</strong> applicant1@email.com / apply123</p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:16002';

    async function handleLogin(e) {
      e.preventDefault();
      const alert = document.getElementById('login-alert');
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      alert.innerHTML = '';

      try {
        const resp = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password })
        });
        const data = await resp.json();

        if (!resp.ok) {
          alert.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
          btn.disabled = false;
          btn.textContent = 'Log In';
          return;
        }

        sessionStorage.setItem('find_token', data.token);
        sessionStorage.setItem('find_user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
      } catch (err) {
        alert.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    }
  </script>
</body>
</html>
