<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — FIND</title>
  <link rel="stylesheet" href="/css/theme.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">
        <h1>FIND</h1>
        <p>Create a new account</p>
      </div>

      <div id="register-alert"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;">
          <div class="form-group">
            <label class="form-label" for="first_name">First Name</label>
            <input class="form-input" type="text" id="first_name" name="first_name" placeholder="John" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">Last Name</label>
            <input class="form-input" type="text" id="last_name" name="last_name" placeholder="Smith" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Account Type</label>
          <select class="form-select" id="role" name="role" required>
            <option value="applicant">Applicant</option>
            <option value="staff">HR Staff</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="register-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = '{{ shared_api_public_url }}';

    async function handleRegister(e) {
      e.preventDefault();
      const alert = document.getElementById('register-alert');
      const btn = document.getElementById('register-btn');

      const payload = {
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        role: document.getElementById('role').value,
      };

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      alert.innerHTML = '';

      try {
        const resp = await fetch(`${API_URL}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();

        if (!resp.ok) {
          alert.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }

        alert.innerHTML = '<div class="alert alert-success">Account created! Redirecting to login...</div>';
        setTimeout(() => { window.location.href = '/login'; }, 1500);
      } catch (err) {
        alert.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
