<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Profile — FIND{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="{{ home_url }}" class="navbar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            FIND
        </a>
        <div class="navbar-user">
            <a class="btn btn-ghost btn-sm" href="{{ home_url }}">&#8592; Home</a>
            <span class="user-badge" id="nav-role-badge"></span>
            <span id="nav-user-name" style="font-size:0.9rem;font-weight:500;"></span>
            <button class="btn btn-ghost btn-sm" id="nav-logout-btn" onclick="handleLogout()" style="display:none;">Log Out</button>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <div id="toast-area"></div>
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Themed confirmation dialog (replaces the browser's native confirm) -->
<div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h3 class="modal-title" id="confirm-title">Please confirm</h3>
        <p class="modal-message" id="confirm-message"></p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <span>&copy; 2026 FIND — Advanced Software Development</span>
        <span>UTS 41026</span>
    </div>
</footer>

<script>
    // Shared FIND runtime: session auth guard, navbar, toasts, htmx.config,
    // 401->login, HX-Redirect and the themed confirm dialog all live here.
    window.__FIND_CONFIG = {
        sharedApiUrl: '{{ shared_api_public_url }}',
        loginUrl: '{{ login_url }}',
        logoutUrl: '{{ logout_url }}'
    };
</script>
<script src="/js/find-app.js"></script>

<script>
    // Student-1-specific behaviour layered on top of the shared runtime.
    (function () {
        // Extra upload/error toasts (the shared runtime already redirects on 401).
        document.body.addEventListener('htmx:responseError', function (e) {
            var status = e.detail && e.detail.xhr && e.detail.xhr.status;
            if (status === 401) return;
            if (status === 413) {
                window.showToast('File is too large. Max 5MB.', 'error');
            } else {
                window.showToast('Something went wrong. Please try again.', 'error');
            }
        });

        // Auto-dismiss inline fragment messages (profile/resume/user forms).
        document.body.addEventListener('htmx:afterSwap', function () {
            ['profile-msg', 'resume-msg', 'user-details-msg'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el && el.innerHTML.trim()) {
                    setTimeout(function () { el.innerHTML = ''; }, 5000);
                }
            });
        });

        // Keep the navbar name in sync after a successful /user save (HX-Trigger).
        document.body.addEventListener('userUpdated', function (e) {
            var nameEl = document.getElementById('nav-user-name');
            if (nameEl && e.detail && e.detail.first_name) {
                nameEl.textContent = e.detail.first_name + ' ' + (e.detail.last_name || '');
            }
        });
    })();
</script>
</body>
</html>
