<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}My Profile — FIND{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="{{ home_url }}" class="navbar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            FIND
        </a>
        <div class="navbar-user">
            <a class="btn btn-ghost btn-sm" href="{{ home_url }}">&#8592; Home</a>
            <span class="user-badge" id="nav-role-badge"></span>
            <span id="nav-user-name" style="font-size:0.9rem;font-weight:500;"></span>
            <button class="btn btn-ghost btn-sm" id="nav-logout-btn" onclick="handleLogout()" style="display:none;">Log Out</button>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <div id="toast-area"></div>
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Themed confirmation dialog (replaces the browser's native confirm) -->
<div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h3 class="modal-title" id="confirm-title">Please confirm</h3>
        <p class="modal-message" id="confirm-message"></p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="container">
        <span>&copy; 2026 FIND — Advanced Software Development</span>
        <span>UTS 41026</span>
    </div>
</footer>

<script>
(function () {
    const SHARED_API_URL = '{{ shared_api_public_url }}';
    const LOGIN_URL = '{{ login_url }}';
    const LOGOUT_URL = '{{ logout_url }}';
    window.__findLoginUrl = LOGIN_URL;
    window.__findLogoutUrl = LOGOUT_URL;

    /* ---- Themed confirmation modal ------------------------------------- */
    const overlay = document.getElementById('confirm-modal');
    const message = document.getElementById('confirm-message');
    const okBtn = document.getElementById('confirm-ok');
    const cancelBtn = document.getElementById('confirm-cancel');
    let pending = null;

    function closeConfirm() { overlay.hidden = true; pending = null; }

    cancelBtn.addEventListener('click', closeConfirm);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeConfirm(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !overlay.hidden) closeConfirm(); });
    okBtn.addEventListener('click', () => {
        const run = pending;
        closeConfirm();
        if (run) run();
    });

    document.body.addEventListener('htmx:confirm', (e) => {
        if (!e.detail.question) return;
        e.preventDefault();
        message.textContent = e.detail.question;
        const isDelete = e.detail.question.toLowerCase().indexOf('delete') !== -1;
        okBtn.className = isDelete ? 'btn btn-danger' : 'btn btn-primary';
        okBtn.textContent = isDelete ? 'Delete' : 'Confirm';
        pending = () => e.detail.issueRequest(true);
        overlay.hidden = false;
    });

    /* ---- Toast notifications -------------------------------------------- */
    function showToast(text, kind) {
        const area = document.getElementById('toast-area');
        if (!area) return;
        const div = document.createElement('div');
        div.className = kind === 'error' ? 'alert alert-error toast' : 'alert alert-success toast';
        div.textContent = text;
        area.appendChild(div);
        setTimeout(() => {
            div.classList.add('toast-hide');
            setTimeout(() => div.remove(), 400);
        }, 4000);
    }
    window.showToast = showToast;

    document.body.addEventListener('showToast', (e) => showToast(e.detail.value || 'Done', 'success'));
    document.body.addEventListener('showErrorToast', (e) => showToast(e.detail.value || 'Something went wrong.', 'error'));

    /* ---- Auto-dismiss inline fragment messages (profile/resume/user forms) */
    document.body.addEventListener('htmx:afterSwap', () => {
        ['profile-msg', 'resume-msg', 'user-details-msg'].forEach((id) => {
            const el = document.getElementById(id);
            if (el && el.innerHTML.trim()) {
                setTimeout(() => { el.innerHTML = ''; }, 5000);
            }
        });
    });

    /* ---- Global HTMX config ---------------------------------------------- */
    if (window.htmx) {
        window.htmx.config.withCredentials = true;
    }
    document.body.addEventListener('htmx:responseError', (e) => {
        const status = e.detail && e.detail.xhr && e.detail.xhr.status;
        if (status === 401) {
            window.location.href = LOGIN_URL;
        } else if (status === 413) {
            showToast('File is too large. Max 5MB.', 'error');
        } else {
            showToast('Something went wrong. Please try again.', 'error');
        }
    });

    /* ---- Navbar user info (via shared-api session cookie) ---------------- */
    function applyUser(user) {
        const nameEl = document.getElementById('nav-user-name');
        const badgeEl = document.getElementById('nav-role-badge');
        const logoutBtn = document.getElementById('nav-logout-btn');
        if (nameEl) nameEl.textContent = user.first_name + ' ' + user.last_name;
        if (badgeEl) badgeEl.textContent = user.role === 'staff' ? 'Staff' : 'Applicant';
        if (logoutBtn) logoutBtn.style.display = '';
    }

    // Fired by the backend (HX-Trigger) after a successful /user save, since the
    // navbar name lives outside the user-details-panel's own swap target.
    document.body.addEventListener('userUpdated', (e) => {
        const nameEl = document.getElementById('nav-user-name');
        if (nameEl && e.detail && e.detail.first_name) {
            nameEl.textContent = e.detail.first_name + ' ' + (e.detail.last_name || '');
        }
    });

    fetch(SHARED_API_URL + '/api/auth/session', { credentials: 'include' })
        .then((resp) => {
            if (!resp.ok) { window.location.href = LOGIN_URL; return null; }
            return resp.json();
        })
        .then((data) => {
            if (!data || !data.user) return;
            applyUser(data.user);
            window.__findUser = data.user;
            document.body.dispatchEvent(new Event('authReady'));
        })
        .catch(() => { window.location.href = LOGIN_URL; });
})();

function handleLogout() {
    fetch(window.__findLogoutUrl, { method: 'POST', credentials: 'include' })
        .catch(() => {})
        .then(() => { window.location.href = window.__findLoginUrl; });
}
</script>
</body>
</html>
