{% extends "base.html" %}
{% block title %}My Profile — FIND{% endblock %}

{% block content %}
<div class="page-head">
    <h1 class="page-title">My Profile</h1>
</div>

<div class="card" style="margin-bottom:2rem;">
    <div id="user-details-panel"
         hx-get="{{ backend_url }}/user"
         hx-trigger="authReady from:body"
         hx-swap="innerHTML">
    </div>
</div>

<div class="card" style="margin-bottom:2rem;">
    <div id="profile-panel"
         hx-get="{{ backend_url }}/profile"
         hx-trigger="authReady from:body"
         hx-swap="innerHTML">
    </div>
</div>
{% endblock %}
