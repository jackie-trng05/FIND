{% extends "base.html" %}
{% block title %}My Profile — FIND{% endblock %}

{% block content %}
<style>
    .mcp-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
    .mcp-toggle-row { display: flex; align-items: center; gap: 0.5rem; }
    .mcp-state { font-weight: 700; font-size: 0.8rem; }
    .mcp-on { color: #16a34a; }
    .mcp-off { color: #dc2626; }
    .mcp-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.75rem; }
    .mcp-panel { padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--primary-light); font-size: 0.85rem; }
    .mcp-panel h3 { font-size: 0.9rem; margin: 0 0 0.4rem; }
    .mcp-panel h4 { font-size: 0.78rem; margin: 0.6rem 0 0.2rem; color: var(--text-muted); }
    .mcp-answer { white-space: pre-wrap; word-break: break-word; line-height: 1.5; margin: 0.4rem 0; }
    .mcp-citations { margin: 0.2rem 0 0 1rem; font-size: 0.78rem; color: var(--text-muted); }
    .badge-danger { background: #fde8e8; color: #991b1b; }
    /* MCP Insights are grounded in the applicant's profile/resume; staff have neither. */
    body.role-staff .applicant-only { display: none !important; }
</style>

<div class="page-head">
    <h1 class="page-title">My Profile</h1>
</div>

<div class="card" style="margin-bottom:2rem;">
    <div id="user-details-panel"
         hx-get="{{ backend_url }}/user"
         hx-trigger="authReady from:body"
         hx-swap="innerHTML">
    </div>
</div>

<div class="card" style="margin-bottom:2rem;">
    <div id="profile-panel"
         hx-get="{{ backend_url }}/profile"
         hx-trigger="authReady from:body"
         hx-swap="innerHTML">
    </div>
</div>

<div class="card applicant-only" style="margin-bottom:2rem;">
    <div class="mcp-head">
        <h2 style="font-size:1rem;margin:0;">MCP Insights</h2>
        <div class="mcp-toggle-row">
            <label class="toggle-switch" for="mcp-toggle" title="Enable or disable MCP Mode">
                <input id="mcp-toggle" type="checkbox" checked onchange="onMcpToggle()">
                <span class="toggle-label"></span>
            </label>
            <span id="mcp-state" class="mcp-state mcp-on">ON</span>
        </div>
    </div>
    <div class="mcp-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="mcp-profile-btn" onclick="runMcpTool('/mcp/applicant-profile')">Applicant profile</button>
        <button type="button" class="btn btn-primary btn-sm" id="mcp-strengths-btn" onclick="runMcpTool('/mcp/strengths-summary')">Summarise strengths</button>
    </div>
    <div id="mcp-result" class="mcp-panel">MCP responses will appear here.</div>
</div>

<div class="card applicant-only" style="margin-bottom:2rem;">
    <div class="mcp-head">
        <h2 style="font-size:1rem;margin:0;">RAG Assistant</h2>
        <div class="mcp-toggle-row">
            <label class="toggle-switch" for="rag-toggle" title="Enable or disable RAG Mode">
                <input id="rag-toggle" type="checkbox" checked onchange="onRagToggle()">
                <span class="toggle-label"></span>
            </label>
            <span id="rag-state" class="mcp-state mcp-on">ON</span>
        </div>
    </div>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;">
        <input type="text" id="rag-query" class="input" placeholder="Ask a question about the FIND platform…"
               value="What is on my applicant profile?"
               style="flex:1;min-width:220px;padding:0.4rem 0.6rem;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;">
    </div>
    <div class="mcp-actions">
        <button type="button" class="btn btn-primary btn-sm" id="rag-answer-btn" onclick="runRag('/rag/answer')">Ask With Citations</button>
        <button type="button" class="btn btn-secondary btn-sm" id="rag-retrieve-btn" onclick="runRag('/rag/retrieve')">Retrieve context</button>
        <button type="button" class="btn btn-ghost btn-sm" id="rag-refresh-btn" onclick="runRag('/rag/refresh')">Refresh corpus</button>
    </div>
    <div id="rag-result" class="mcp-panel">RAG responses will appear here.</div>
</div>

<script>
    const MCP_KEY = "mcp_mode_enabled";

    function isMcpEnabled() { return document.getElementById("mcp-toggle").checked; }

    function renderMcpState() {
        const state = document.getElementById("mcp-state");
        const on = isMcpEnabled();
        state.textContent = on ? "ON" : "OFF";
        state.classList.toggle("mcp-on", on);
        state.classList.toggle("mcp-off", !on);
        document.getElementById("mcp-profile-btn").disabled = !on;
        document.getElementById("mcp-strengths-btn").disabled = !on;
    }

    function onMcpToggle() {
        localStorage.setItem(MCP_KEY, String(isMcpEnabled()));
        renderMcpState();
        document.getElementById("mcp-result").innerHTML = isMcpEnabled()
            ? "MCP responses will appear here."
            : '<p class="mcp-off">MCP Mode is OFF. Enable it to run MCP tools.</p>';
    }

    function loadMcpMode() {
        const persisted = localStorage.getItem(MCP_KEY);
        document.getElementById("mcp-toggle").checked = persisted === null ? true : persisted === "true";
        renderMcpState();
        if (!isMcpEnabled()) {
            document.getElementById("mcp-result").innerHTML = '<p class="mcp-off">MCP Mode is OFF. Enable it to run MCP tools.</p>';
        }
    }

    async function runMcpTool(path) {
        if (!isMcpEnabled()) {
            document.getElementById("mcp-result").innerHTML = '<p class="mcp-off">MCP Mode is OFF. Enable it to run MCP tools.</p>';
            return;
        }
        const panel = document.getElementById("mcp-result");
        panel.innerHTML = "Contacting MCP server…";
        try {
            const resp = await fetch("{{ backend_url }}" + path, {
                method: "POST",
                credentials: "include",
                headers: { "X-MCP-Mode": isMcpEnabled() ? "on" : "off" },
            });
            if (resp.status === 503) {
                panel.innerHTML = '<p class="mcp-off">MCP server unavailable. Ensure the shared MCP server is running on port 16050.</p>';
                return;
            }
            panel.innerHTML = await resp.text();
        } catch (e) {
            panel.innerHTML = '<p class="mcp-off">Failed to reach the MCP server. Is it running on port 16050?</p>';
        }
    }

    document.body.addEventListener("authReady", loadMcpMode);

    // --- RAG Assistant (grounded via shared RAG server) ---
    const RAG_KEY = "rag_mode_enabled";

    function isRagEnabled() { return document.getElementById("rag-toggle").checked; }

    function renderRagState() {
        const state = document.getElementById("rag-state");
        const on = isRagEnabled();
        state.textContent = on ? "ON" : "OFF";
        state.classList.toggle("mcp-on", on);
        state.classList.toggle("mcp-off", !on);
        document.getElementById("rag-answer-btn").disabled = !on;
        document.getElementById("rag-retrieve-btn").disabled = !on;
        document.getElementById("rag-refresh-btn").disabled = !on;
    }

    function onRagToggle() {
        localStorage.setItem(RAG_KEY, String(isRagEnabled()));
        renderRagState();
        document.getElementById("rag-result").innerHTML = isRagEnabled()
            ? "RAG responses will appear here."
            : '<p class="mcp-off">RAG Mode is OFF. Enable it to run RAG tools.</p>';
    }

    function loadRagMode() {
        const persisted = localStorage.getItem(RAG_KEY);
        document.getElementById("rag-toggle").checked = persisted === null ? true : persisted === "true";
        renderRagState();
        if (!isRagEnabled()) {
            document.getElementById("rag-result").innerHTML = '<p class="mcp-off">RAG Mode is OFF. Enable it to run RAG tools.</p>';
        }
    }

    // RAG retrieval has no session concept, so a first-person query ("my", "me", "I")
    // is ambiguous across every applicant's profile. Rewrite it with the signed-in
    // user's full name — the literal token their profile chunk is grounded in —
    // without touching what the user typed in the input.
    const PERSONAL_PRONOUN_PATTERN = /\b(my|mine|myself|me|i)\b/i;

    function personalizeQuery(rawQuery) {
        const user = window.__findUser;
        if (!user || !user.first_name || !user.last_name) return rawQuery;
        if (!PERSONAL_PRONOUN_PATTERN.test(rawQuery)) return rawQuery;
        const fullName = `${user.first_name} ${user.last_name}`;
        if (rawQuery.toLowerCase().includes(fullName.toLowerCase())) return rawQuery;
        return `${rawQuery} (Referring to applicant ${fullName}.)`;
    }

    async function runRag(path) {
        if (!isRagEnabled()) {
            document.getElementById("rag-result").innerHTML = '<p class="mcp-off">RAG Mode is OFF. Enable it to run RAG tools.</p>';
            return;
        }
        const rawQuery = document.getElementById("rag-query").value.trim();
        if (path !== "/rag/refresh" && !rawQuery) {
            document.getElementById("rag-result").innerHTML = '<p class="mcp-off">Enter a question first.</p>';
            return;
        }
        const query = personalizeQuery(rawQuery);
        const panel = document.getElementById("rag-result");
        const buttons = ["rag-answer-btn", "rag-retrieve-btn", "rag-refresh-btn"].map(id => document.getElementById(id));
        panel.innerHTML = path === "/rag/answer"
            ? '<span class="mcp-spinner"></span> Generating grounded answer — the local AI model can take up to a minute…'
            : '<span class="mcp-spinner"></span> Contacting RAG server…';
        buttons.forEach(b => b.disabled = true);
        try {
            const resp = await fetch("{{ backend_url }}" + path, {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                    "X-RAG-Mode": isRagEnabled() ? "on" : "off",
                },
                body: new URLSearchParams({ query: query, k: "5" }),
            });
            if (resp.status === 503) {
                panel.innerHTML = '<p class="mcp-off">RAG server unavailable. Ensure the shared RAG server is running on port 16070.</p>';
                return;
            }
            panel.innerHTML = await resp.text();
        } catch (e) {
            panel.innerHTML = '<p class="mcp-off">Failed to reach the RAG server. Is it running on port 16070?</p>';
        } finally {
            renderRagState();
        }
    }

    document.body.addEventListener("authReady", loadRagMode);
</script>
{% endblock %}
