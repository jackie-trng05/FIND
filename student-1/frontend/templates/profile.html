<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — FIND</title>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <div class="page-wrapper" id="page-wrapper" style="display:none;">
    <nav class="navbar">
      <div class="container" style="display:flex;align-items:center;justify-content:space-between;">
        <a href="http://localhost:16001/dashboard" class="navbar-brand">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          FIND
        </a>
        <div class="navbar-user">
          <span class="user-badge" id="user-role-badge"></span>
          <span id="user-name" style="font-size:0.9rem;font-weight:500;"></span>
          <button class="btn btn-ghost btn-sm" onclick="handleLogout()">Log Out</button>
        </div>
      </div>
    </nav>

    <main class="main-content">
      <div class="container">
        <div id="alert-area"></div>

        <!-- User Details Section (identity fields live on the shared users table, not the profile) -->
        <div class="card" style="margin-bottom:2rem;">
          <h2 style="margin-bottom:1rem;">User Details</h2>
          <form id="user-details-form" onsubmit="handleUserDetailsSubmit(event)">
            <div class="grid grid-2">
              <div class="form-group">
                <label class="form-label" for="ud_first_name">First Name</label>
                <input class="form-input" type="text" id="ud_first_name" name="first_name" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="ud_last_name">Last Name</label>
                <input class="form-input" type="text" id="ud_last_name" name="last_name" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Save Details</button>
          </form>
        </div>

        <!-- Profile Section -->
        <div class="card" style="margin-bottom:2rem;">
          <h2 id="profile-heading" style="margin-bottom:1rem;">User Profile</h2>
          <form id="profile-form" onsubmit="handleProfileSubmit(event)">
            <div class="grid grid-2">
              <div class="form-group">
                <label class="form-label" for="phone">Phone</label>
                <input class="form-input" type="tel" id="phone" name="phone">
              </div>
              <div class="form-group">
                <label class="form-label" for="location">Location</label>
                <input class="form-input" type="text" id="location" name="location">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="professional_title">Professional Title</label>
              <input class="form-input" type="text" id="professional_title" name="professional_title">
            </div>
            <div class="form-group">
              <label class="form-label" for="summary">Summary</label>
              <textarea class="form-input" id="summary" name="summary" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="interests">Interests</label>
              <input class="form-input" type="text" id="interests" name="interests" placeholder="Comma-separated interests">
            </div>
            <div style="display:flex;gap:0.75rem;margin-top:1rem;">
              <button type="submit" class="btn btn-primary" id="profile-submit-btn">Save Profile</button>
              <button type="button" class="btn btn-danger" id="profile-delete-btn" style="display:none;" onclick="handleDeleteProfile()">Delete Profile</button>
            </div>
          </form>
        </div>

        <!-- Resume Section -->
        <div class="card" id="resume-section" style="display:none;">
          <h2 style="margin-bottom:1rem;">My Resumes</h2>

          <div class="table-wrapper" id="resume-table-wrapper" style="margin-bottom:1.5rem;">
            <table>
              <thead>
                <tr>
                  <th>File Name</th>
                  <th>Type</th>
                  <th>Uploaded</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="resume-tbody">
                <tr><td colspan="4" style="text-align:center;color:var(--text-muted);">No resumes uploaded yet.</td></tr>
              </tbody>
            </table>
          </div>

          <h3 style="margin-bottom:0.75rem;">Upload Resume</h3>
          <form id="resume-upload-form" onsubmit="handleResumeUpload(event)">
            <div class="form-group">
              <label class="form-label" for="resume-file">Choose file (PDF, DOC, or DOCX — max 10MB)</label>
              <input class="form-input" type="file" id="resume-file" name="file" accept=".pdf,.doc,.docx" required>
            </div>
            <button type="submit" class="btn btn-secondary" id="upload-btn">Upload</button>
          </form>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <span>&copy; 2026 FIND — Advanced Software Development</span>
        <span>UTS 41026</span>
      </div>
    </footer>
  </div>

  <script>
    let currentProfile = null;
    let currentRole = null;

    function applyRoleUI() {
      document.getElementById('user-role-badge').textContent = currentRole === 'staff' ? 'Staff' : 'Applicant';
      document.getElementById('resume-section').style.display = (currentRole === 'staff') ? 'none' : '';
    }

    // Identity (first/last name) lives on the shared users table, independent of profile existence
    function applyIdentity(body) {
      document.getElementById('ud_first_name').value = body.first_name || '';
      document.getElementById('ud_last_name').value = body.last_name || '';
      document.getElementById('user-name').textContent = `${body.first_name || ''} ${body.last_name || ''}`.trim();
    }

    function showAlert(msg, type) {
      const area = document.getElementById('alert-area');
      area.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      setTimeout(() => { area.innerHTML = ''; }, 5000);
    }

    async function apiFetch(path, opts = {}) {
      opts.credentials = 'include';
      const resp = await fetch(path, opts);
      return resp;
    }

    async function loadProfile() {
      const resp = await apiFetch('/api/profiles/me');
      const body = await resp.json().catch(() => ({}));
      currentRole = body.role || currentRole;
      applyIdentity(body);

      if (resp.status === 404) {
        currentProfile = null;
        document.getElementById('profile-submit-btn').textContent = 'Create Profile';
        document.getElementById('profile-delete-btn').style.display = 'none';
        applyRoleUI();
        return;
      }
      if (!resp.ok) {
        window.location.href = 'http://localhost:16001/login';
        return;
      }
      currentProfile = body;
      document.getElementById('profile-submit-btn').textContent = 'Update Profile';
      document.getElementById('profile-delete-btn').style.display = '';
      document.getElementById('phone').value = currentProfile.phone || '';
      document.getElementById('location').value = currentProfile.location || '';
      document.getElementById('professional_title').value = currentProfile.professional_title || '';
      document.getElementById('summary').value = currentProfile.summary || '';
      document.getElementById('interests').value = currentProfile.interests || '';
      applyRoleUI();
      if (currentRole !== 'staff') await loadResumes();
    }

    async function handleUserDetailsSubmit(e) {
      e.preventDefault();
      const first_name = document.getElementById('ud_first_name').value;
      const last_name = document.getElementById('ud_last_name').value;

      const resp = await apiFetch('/api/user', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ first_name, last_name }),
      });

      if (resp.ok) {
        document.getElementById('user-name').textContent = `${first_name} ${last_name}`.trim();
        showAlert('Details updated.', 'success');
      } else {
        const data = await resp.json().catch(() => ({}));
        showAlert(data.error || 'Failed to update details.', 'error');
      }
    }

    async function handleProfileSubmit(e) {
      e.preventDefault();
      const body = {
        phone: document.getElementById('phone').value,
        location: document.getElementById('location').value,
        professional_title: document.getElementById('professional_title').value,
        summary: document.getElementById('summary').value,
        interests: document.getElementById('interests').value,
      };

      let resp;
      if (currentProfile) {
        resp = await apiFetch(`/api/profiles/${currentProfile.profile_id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } else {
        resp = await apiFetch('/api/profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      }

      if (resp.ok) {
        showAlert(currentProfile ? 'Profile updated.' : 'Profile created.', 'success');
        await loadProfile();
      } else {
        const data = await resp.json();
        showAlert(data.error || 'Failed to save profile.', 'error');
      }
    }

    async function handleDeleteProfile() {
      if (!currentProfile) return;
      if (!confirm('Are you sure you want to delete your profile? This will also delete all your resumes.')) return;

      const resp = await apiFetch(`/api/profiles/${currentProfile.profile_id}`, { method: 'DELETE' });
      if (resp.ok) {
        showAlert('Profile deleted.', 'success');
        currentProfile = null;
        document.getElementById('profile-form').reset();
        await loadProfile();
      } else {
        const data = await resp.json();
        showAlert(data.error || 'Failed to delete profile.', 'error');
      }
    }

    async function loadResumes() {
      if (!currentProfile) return;
      const resp = await apiFetch(`/api/profiles/${currentProfile.profile_id}/resumes`);
      const tbody = document.getElementById('resume-tbody');
      if (!resp.ok) {
        tbody.innerHTML = '<tr><td colspan="4">Failed to load resumes.</td></tr>';
        return;
      }
      const resumes = await resp.json();
      if (resumes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);">No resumes uploaded yet.</td></tr>';
        return;
      }
      tbody.innerHTML = resumes.map(r => `
        <tr>
          <td>${escapeHtml(r.file_name)}</td>
          <td><span class="badge">${fileTypeLabel(r.file_type)}</span></td>
          <td>${new Date(r.uploaded_at).toLocaleDateString()}</td>
          <td>
            <a href="/api/resumes/${r.resume_id}/download" class="btn btn-secondary btn-sm">Download</a>
            <button class="btn btn-danger btn-sm" onclick="handleDeleteResume(${r.resume_id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    async function handleResumeUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById('resume-file');
      const file = fileInput.files[0];
      if (!file) return;

      const allowed = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
      if (!allowed.includes(file.type)) {
        showAlert('Only PDF, DOC, and DOCX files are allowed.', 'error');
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showAlert('File exceeds 10MB limit.', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      const btn = document.getElementById('upload-btn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';

      const resp = await apiFetch(`/api/profiles/${currentProfile.profile_id}/resumes`, {
        method: 'POST',
        body: formData,
      });

      btn.disabled = false;
      btn.textContent = 'Upload';

      if (resp.ok) {
        showAlert('Resume uploaded.', 'success');
        fileInput.value = '';
        await loadResumes();
      } else {
        const data = await resp.json();
        showAlert(data.error || 'Upload failed.', 'error');
      }
    }

    async function handleDeleteResume(resumeId) {
      if (!confirm('Delete this resume?')) return;
      const resp = await apiFetch(`/api/resumes/${resumeId}`, { method: 'DELETE' });
      if (resp.ok) {
        showAlert('Resume deleted.', 'success');
        await loadResumes();
      } else {
        const data = await resp.json();
        showAlert(data.error || 'Failed to delete resume.', 'error');
      }
    }

    async function handleLogout() {
      await apiFetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'http://localhost:16001/login';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function fileTypeLabel(mime) {
      if (mime.includes('pdf')) return 'PDF';
      if (mime.includes('wordprocessingml')) return 'DOCX';
      if (mime.includes('msword')) return 'DOC';
      return mime;
    }

    async function init() {
      const resp = await apiFetch('/api/profiles/me');
      if (resp.status === 401) {
        window.location.href = 'http://localhost:16001/login';
        return;
      }
      document.getElementById('page-wrapper').style.display = '';
      const body = await resp.json().catch(() => ({}));
      currentRole = body.role || currentRole;
      applyIdentity(body);

      if (resp.status === 404) {
        currentProfile = null;
        document.getElementById('profile-submit-btn').textContent = 'Create Profile';
        document.getElementById('profile-delete-btn').style.display = 'none';
        applyRoleUI();
      } else if (resp.ok) {
        currentProfile = body;
        document.getElementById('profile-submit-btn').textContent = 'Update Profile';
        document.getElementById('profile-delete-btn').style.display = '';
        document.getElementById('phone').value = currentProfile.phone || '';
        document.getElementById('location').value = currentProfile.location || '';
        document.getElementById('professional_title').value = currentProfile.professional_title || '';
        document.getElementById('summary').value = currentProfile.summary || '';
        document.getElementById('interests').value = currentProfile.interests || '';
        applyRoleUI();
        if (currentRole !== 'staff') await loadResumes();
      }
    }

    init();
  </script>
</body>
</html>
