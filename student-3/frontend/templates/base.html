<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Applications — FIND{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a href="{{ home_url }}" class="navbar-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            FIND
        </a>
        <div class="navbar-user">
            <a class="btn btn-ghost btn-sm" href="{{ home_url }}">&#8592; Home</a>
            <a class="btn btn-ghost btn-sm" href="{{ job_postings_url }}">Job Postings</a>
            <span class="user-badge" id="nav-role-badge"></span>
            <span id="nav-user-name" style="font-size:0.9rem;font-weight:500;"></span>
            <button class="btn btn-ghost btn-sm" id="nav-logout-btn" onclick="handleLogout()" style="display:none;">Log Out</button>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="container">
        <div id="toast-area"></div>
        {% block content %}{% endblock %}
    </div>
</main>

<!-- Themed confirmation dialog (replaces the browser's native confirm) -->
<div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <h3 class="modal-title" id="confirm-title">Please confirm</h3>
        <p class="modal-message" id="confirm-message"></p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="confirm-cancel">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirm-ok">Confirm</button>
        </div>
    </div>
</div>

<!-- Rejection-follow-up dialog (staff-only) -->
<div id="reject-modal" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reject-title">
        <h3 class="modal-title" id="reject-title">Remove from recruitment?</h3>
        <p class="modal-message">Would you like to remove candidate from the recruitment process now?</p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="reject-cancel">Cancel</button>
            <button type="button" class="btn btn-danger" id="reject-yes">Yes</button>
        </div>
    </div>
</div>

<script>
    // Shared FIND runtime: session auth guard, navbar, toasts, htmx.config,
    // 401->login, HX-Redirect, the themed confirm dialog and delegated
    // row-click navigation all live here.
    window.__FIND_CONFIG = {
        sharedApiUrl: '{{ shared_api_public_url }}',
        loginUrl: '{{ login_url }}',
        logoutUrl: '{{ logout_url }}'
    };
</script>
<script src="/js/find-app.js"></script>

<script>
    // Student-3-specific: rejection follow-up dialog (staff-only). Fired by the
    // status <select> when the new status is "Rejected".
    (function () {
        var rejectModal = document.getElementById('reject-modal');
        var rejectCancel = document.getElementById('reject-cancel');
        var rejectYes = document.getElementById('reject-yes');
        var rejectContext = null;
        rejectCancel.addEventListener('click', function () { rejectModal.hidden = true; rejectContext = null; });
        rejectModal.addEventListener('click', function (e) { if (e.target === rejectModal) rejectModal.hidden = true; });
        rejectYes.addEventListener('click', function () {
            if (rejectContext) rejectContext();
            rejectModal.hidden = true;
            rejectContext = null;
        });
        window.confirmRejection = function (onYes) {
            rejectContext = onYes;
            rejectModal.hidden = false;
        };
    })();
</script>

{% block scripts %}{% endblock %}
</body>
</html>
