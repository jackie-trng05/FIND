{% extends "base.html" %}
{% block title %}Candidate Profile — FIND{% endblock %}

{% block content %}
<div class="page-head">
    <a class="btn btn-secondary btn-sm" href="/">&#8592; All Applications</a>
</div>
<div class="card">
    <div id="candidate-profile"
         hx-get="/fragments/staff/applications/{{ application_id }}/profile"
         hx-trigger="authReady from:body, statusChanged from:body"
         hx-swap="innerHTML"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    function updateCandidateStatus(applicationId, nextStatus, successMessage, failureMessage) {
        fetch('{{ backend_url }}/api/applications/' + applicationId + '/status', {
            method: 'PUT',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ application_status: nextStatus })
        }).then((r) => {
            if (r.ok) {
                window.showToast(successMessage, 'success');
                document.body.dispatchEvent(new Event('statusChanged'));
            } else {
                window.showToast(failureMessage, 'error');
            }
        }).catch(() => { window.showToast('Network error.', 'error'); });
    }

    function confirmCandidateAction(message, confirmText) {
        const modal = document.getElementById('confirm-modal');
        const messageEl = document.getElementById('confirm-message');
        const cancelBtn = document.getElementById('confirm-cancel');
        const okBtn = document.getElementById('confirm-ok');

        if (!modal || !messageEl || !cancelBtn || !okBtn) {
            return Promise.resolve(window.confirm(message));
        }

        return new Promise((resolve) => {
            const previousMessage = messageEl.textContent;
            const previousOkText = okBtn.textContent;
            const previousOkClass = okBtn.className;

            function cleanup() {
                cancelBtn.removeEventListener('click', onCancel);
                okBtn.removeEventListener('click', onConfirm);
                modal.removeEventListener('click', onOverlayClick);
                document.removeEventListener('keydown', onKeydown);
                messageEl.textContent = previousMessage;
                okBtn.textContent = previousOkText;
                okBtn.className = previousOkClass;
            }

            function finish(result) {
                cleanup();
                modal.hidden = true;
                resolve(result);
            }

            function onCancel() { finish(false); }
            function onConfirm() { finish(true); }
            function onOverlayClick(event) {
                if (event.target === modal) finish(false);
            }
            function onKeydown(event) {
                if (event.key === 'Escape' && !modal.hidden) finish(false);
            }

            messageEl.textContent = message;
            okBtn.textContent = confirmText;
            okBtn.className = confirmText === 'Reject candidate' ? 'btn btn-danger' : 'btn btn-primary';

            cancelBtn.addEventListener('click', onCancel);
            okBtn.addEventListener('click', onConfirm);
            modal.addEventListener('click', onOverlayClick);
            document.addEventListener('keydown', onKeydown);
            modal.hidden = false;
        });
    }

    document.body.addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-shortlist-application-id]');
        if (btn) {
            const applicationId = btn.getAttribute('data-shortlist-application-id');
            const confirmed = await confirmCandidateAction(
                'Move this application to Shortlisted?',
                'Shortlist candidate'
            );
            if (!confirmed) return;
            updateCandidateStatus(
                applicationId,
                'Shortlisted',
                'Candidate shortlisted.',
                'Failed to shortlist candidate.'
            );
            return;
        }

        const rejectBtn = e.target.closest('[data-reject-application-id]');
        if (!rejectBtn) return;
        const applicationId = rejectBtn.getAttribute('data-reject-application-id');
        const confirmed = await confirmCandidateAction(
            'Reject this candidate and remove them from the recruitment process?',
            'Reject candidate'
        );
        if (!confirmed) return;
        updateCandidateStatus(
            applicationId,
            'Rejected',
            'Candidate rejected and removed from recruitment.',
            'Failed to reject candidate.'
        );
    });
})();
</script>
{% endblock %}
