{% extends "base.html" %}
{% block title %}Applications to Schedule — FIND{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Applications to Schedule</h1>
        <p>Shortlisted applicants for your job postings who still need an interview.</p>
    </div>
</div>

<section class="card">
    <div class="filters" id="app-filters">
        <div class="field">
            <label for="f-app-search">Search applicant</label>
            <input id="f-app-search" name="search" type="text" placeholder="Name or application ID">
        </div>
    </div>
    <div id="app-body"
         hx-get="{{ backend_url }}/ui/applications/rows"
         hx-include="#app-filters"
         hx-target="this"
         hx-trigger="load, keyup changed delay:300ms from:#app-filters, interviewsChanged from:body">
        <p class="loading">Loading…</p>
    </div>
</section>
{% endblock %}
