{% extends "base.html" %}
{% block title %}Interviews · Calendar — FIND{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Interview Calendar</h1>
        <p>Your interviews at a glance.</p>
    </div>
</div>

<section class="card calendar">
    <div id="cal-wrap"
         hx-get="{{ backend_url }}/ui/calendar"
         hx-trigger="load, interviewsChanged from:body"
         hx-target="this">
        <p class="loading">Loading…</p>
    </div>
</section>
{% endblock %}
