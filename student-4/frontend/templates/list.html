{% extends "base.html" %}
{% block title %}Interviews · List — FIND{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>All Interviews</h1>
        <p>Filter and browse your interviews.</p>
    </div>
</div>

<section class="card">
    <div class="filters" id="list-filters">
        <div class="field">
            <label for="f-status">Status</label>
            <select id="f-status" name="status">
                <option value="">All</option>
                <option>Shortlisted</option>
                <option>Interview Requested</option>
                <option>Interview Scheduled</option>
                <option>Interview Completed</option>
                <option>Withdrawn</option>
            </select>
        </div>
        <div class="field">
            <label for="f-from">From date</label>
            <input id="f-from" name="from" type="date">
        </div>
        <div class="field">
            <label for="f-to">To date</label>
            <input id="f-to" name="to" type="date">
        </div>
        <div class="field staff-only">
            <label for="f-search">Search applicant</label>
            <input id="f-search" name="search" type="text" placeholder="Name or ID">
        </div>
        <div class="field">
            <label>&nbsp;</label>
            <button class="btn btn-secondary" type="button"
                    onclick="this.closest('.filters').querySelectorAll('input,select').forEach(function(e){e.value='';});htmx.trigger('#list-body','refresh');">Reset</button>
        </div>
    </div>

    <div id="list-body"
         hx-get="{{ backend_url }}/ui/interviews/rows"
         hx-include="#list-filters"
         hx-target="this"
         hx-trigger="load, refresh, change from:#list-filters, keyup changed delay:300ms from:#list-filters, interviewsChanged from:body">
        <p class="loading">Loading…</p>
    </div>
</section>
{% endblock %}
