<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCP Mode — FIND</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .mcp-shell { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .mcp-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0; }
        .feature-toggle-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
        .feature-state { font-weight: 600; }
        .feature-on { color: var(--color-success, #16a34a); }
        .feature-off { color: var(--color-danger, #dc2626); }
        .mcp-answer { white-space: pre-wrap; word-break: break-word; }
        .panel-mcp { margin-top: 1rem; padding: 1rem; border: 1px solid var(--color-border, #e5e7eb); border-radius: 8px; }
    </style>
</head>
<body>
<main class="mcp-shell">
    <div class="page-head">
        <h1 class="page-title">MCP Mode</h1>
        <a class="btn btn-secondary btn-sm" href="{{ home_url }}">&#8592; Home</a>
    </div>

    <div class="card">
        <div class="card-header"><h2 class="card-title">Shared MCP Tools</h2></div>

        <div class="feature-toggle-row">
            <label class="toggle-switch" for="mcp-mode-toggle">
                <input id="mcp-mode-toggle" type="checkbox" checked>
                <span class="toggle-label">MCP Enabled</span>
            </label>
            <span id="mcp-mode-state" class="feature-state feature-on">ON</span>
        </div>

        <p class="muted">
            These requests go through this feature's backend/API, which proxies to the
            shared, non-containerised MCP server. Answers include source citations and a
            confidence category.
        </p>

        <div class="mcp-actions">
            <form class="feature-form" hx-post="{{ backend_url }}/mcp/project-files"
                  hx-headers='{"X-MCP-Mode": "on"}' hx-target="#mcp-result" hx-swap="innerHTML">
                <label for="mcp_directory_path">project_files (directory)</label>
                <input id="mcp_directory_path" name="directory_path" type="text" value=".">
                <button type="submit" class="btn btn-primary mcp-action">Run project_files</button>
            </form>

            <form class="feature-form" hx-post="{{ backend_url }}/mcp/ci-report"
                  hx-headers='{"X-MCP-Mode": "on"}' hx-target="#mcp-result" hx-swap="innerHTML">
                <label for="mcp_report_path">ci_report (report path, optional)</label>
                <input id="mcp_report_path" name="report_path" type="text" placeholder="reports/report.json">
                <button type="submit" class="btn btn-primary mcp-action">Run ci_report</button>
            </form>
        </div>

        <div id="mcp-result" class="panel panel-mcp">MCP tool responses will appear here.</div>
    </div>
</main>

<script>
    const mcpModeToggle = document.getElementById("mcp-mode-toggle");
    const mcpModeState = document.getElementById("mcp-mode-state");
    const mcpResultPanel = document.getElementById("mcp-result");
    const MCP_STORAGE_KEY = "mcp_mode_enabled";

    function isMcpEnabled() { return mcpModeToggle.checked; }

    function renderMcpState() {
        if (isMcpEnabled()) {
            mcpModeState.textContent = "ON";
            mcpModeState.classList.add("feature-on");
            mcpModeState.classList.remove("feature-off");
        } else {
            mcpModeState.textContent = "OFF";
            mcpModeState.classList.add("feature-off");
            mcpModeState.classList.remove("feature-on");
        }
    }

    function renderMcpDisabledMessage() {
        mcpResultPanel.innerHTML = "<p>MCP Mode is OFF. Enable MCP Mode to run MCP tools.</p>";
    }

    function saveMcpMode() { localStorage.setItem(MCP_STORAGE_KEY, String(isMcpEnabled())); }

    function loadMcpMode() {
        const persisted = localStorage.getItem(MCP_STORAGE_KEY);
        if (persisted === null) { mcpModeToggle.checked = true; }
        else { mcpModeToggle.checked = persisted === "true"; }
        renderMcpState();
    }

    mcpModeToggle.addEventListener("change", () => {
        saveMcpMode();
        renderMcpState();
        if (!isMcpEnabled()) { renderMcpDisabledMessage(); }
    });

    // Reflect the toggle into the X-MCP-Mode header on every MCP action.
    document.body.addEventListener("htmx:configRequest", (event) => {
        const trigger = event.detail.elt;
        if (trigger && trigger.closest(".feature-form")) {
            event.detail.headers["X-MCP-Mode"] = isMcpEnabled() ? "on" : "off";
        }
    });

    // Block the request client-side when MCP Mode is off.
    document.body.addEventListener("htmx:beforeRequest", (event) => {
        const trigger = event.detail.elt;
        if (trigger && trigger.closest(".feature-form") && !isMcpEnabled()) {
            event.preventDefault();
            renderMcpDisabledMessage();
        }
    });

    loadMcpMode();
    if (!isMcpEnabled()) { renderMcpDisabledMessage(); }
</script>
</body>
</html>
