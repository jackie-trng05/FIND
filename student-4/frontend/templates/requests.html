{% extends "base.html" %}
{% block title %}Interview Requests — FIND{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Interview Requests</h1>
        <p>Respond to interviews you have been requested for.</p>
    </div>
</div>

<section id="req-body"
         hx-get="{{ backend_url }}/ui/requests"
         hx-target="this"
         hx-trigger="load, requestsChanged from:body, interviewChanged from:body">
    <p class="loading">Loading…</p>
</section>
{% endblock %}
