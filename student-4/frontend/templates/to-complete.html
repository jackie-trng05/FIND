{% extends "base.html" %}
{% block title %}Interviews To Complete — FIND{% endblock %}
{% block content %}
<div class="page-head">
    <div>
        <h1>Interviews To Complete</h1>
        <p>Scheduled interviews whose time has passed. Open one to write up the notes and mark it complete.</p>
    </div>
</div>

<section class="card">
    <div class="filters" id="tc-filters">
        <div class="field">
            <label for="f-tc-search">Search applicant</label>
            <input id="f-tc-search" name="search" type="text" placeholder="Name or application ID">
        </div>
    </div>
    <div id="tc-body"
         hx-get="{{ backend_url }}/ui/to-complete/rows"
         hx-include="#tc-filters"
         hx-target="this"
         hx-trigger="load, keyup changed delay:300ms from:#tc-filters, interviewsChanged from:body">
        <p class="loading">Loading…</p>
    </div>
</section>
{% endblock %}
